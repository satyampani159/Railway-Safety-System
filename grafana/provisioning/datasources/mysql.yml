apiVersion: 1

datasources:
  - name: MySQL
    uid: mysql-railway
    type: mysql
    access: proxy
    url: mysql:3306
    user: root
    jsonData:
      database: railway_safety
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      tlsSkipVerify: true
    secureJsonData:
      password: root
    isDefault: true
    editable: true
